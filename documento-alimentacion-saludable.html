<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"> <!-- Codificación UTF-8 para que soporte tildes y la ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento Optimizado</title>
    <!--Enlace al archivo CSS externo -->
    <link rel="stylesheet"href="styles.css">
    <style>
        /* Estilos CSS ultra livianos usando fuentes del sistema */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        /* Esto optimiza el diseño exclusivamente para cuando se guarde en PDF */
        @media print {
            body { margin: 0; color: #000; }
            .no-print { display: none; } /* Oculta botones al imprimir */
        }
    </style>
</head>
<body>

    <h1>documento-alimentacion-saludable</h1>
    <p>Este es un archivo de texto plano estructurado con HTML. Al no pesar casi nada (menos de 2 KB), se descarga de forma instantánea en cualquier conexión.</p>

    <!-- Botón nativo para que el usuario lo guarde como PDF usando el navegador -->
    <button class="no-print" onclick="window.print()">Guardar como PDF</button>

    <!-- SECCIÓN DE LA PORTADA (IMAGEN PREVIA) -->
<section class="seccion-portada">
    <!-- Vinculamos tu imagen 5.webp (ajusta la extensión si es .webp o .png) -->
    <img src="5-wepb" alt="Portada de Alimentación Saludable" class="imagen-portada">
</section>

</body>
</html>
